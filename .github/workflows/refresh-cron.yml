name: Daily content refresh

# Reliable replacement for the Vercel Hobby cron, which was skipping ~1 day in
# 4 (best-effort scheduling, no SLA). GitHub Actions runs the morning refresh by
# hitting /api/refresh with the CRON_SECRET bearer — the same call Vercel Cron
# makes. The Vercel cron in vercel.json stays on as a backup; refresh.js has an
# "already refreshed today" guard so the two triggers can never double-write.
#
# Requires repo secret CRON_SECRET (same value as the Vercel env var of the
# same name). Set it once with:
#   gh secret set CRON_SECRET --repo edmfg/WCCommand

on:
  schedule:
    # Twice a day during the World Cup: 09:00 + 23:00 UTC = ~5am + ~7pm New
    # York (EDT). GitHub may delay scheduled runs by a few minutes under load,
    # but unlike Vercel Hobby cron it effectively never skips. (Hobby caps a
    # cron at one run/day, so both runs go through here, not vercel.json.)
    # After the tournament, drop back to a single "0 9 * * *".
    - cron: "0 9,23 * * *"
  workflow_dispatch: {} # lets you fire a refresh on demand from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/refresh (with retries)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set on the repo"
            exit 1
          fi
          # Retry up to 3x: the grounded Gemini call occasionally returns a
          # truncated/unparseable payload (502) or 0 usable rows. Each retry
          # is a fresh generation, so a transient bad response self-heals. The
          # refresh.js cronRanToday() guard makes repeats idempotent.
          #
          # A manual run from the Actions tab (workflow_dispatch) forces a fresh
          # scrape via ?force=1, bypassing the 6h de-dupe guard — that's the
          # whole point of firing it by hand. Scheduled runs keep the guard.
          URL="https://mfgworldcup.com/api/refresh"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="$URL?force=1"
            echo "Manual dispatch — forcing refresh (bypassing de-dupe guard)"
          fi
          ok=0
          for n in 1 2 3; do
            echo "Attempt $n of 3…"
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "$URL" \
              -H "Authorization: Bearer $CRON_SECRET")
            echo "HTTP $code"
            cat /tmp/resp.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              skipped=$(jq -r 'if .skipped then "yes" else "no" end' /tmp/resp.json 2>/dev/null)
              inserted=$(jq -r '.inserted // 0' /tmp/resp.json 2>/dev/null)
              if [ "$skipped" = "yes" ]; then
                echo "Skipped — already refreshed today. OK."
                ok=1; break
              fi
              if [ "${inserted:-0}" -gt 0 ] 2>/dev/null; then
                echo "Inserted $inserted rows. OK."
                ok=1; break
              fi
              echo "200 but 0 usable rows — will retry"
            fi
            [ "$n" -lt 3 ] && { echo "retrying in 20s…"; sleep 20; }
          done
          if [ "$ok" != "1" ]; then
            echo "::error::refresh failed after 3 attempts"
            exit 1
          fi
